<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>경주정보고 School Tool Portal</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="header-inner" role="banner">
      <div class="brand">
        <!-- Replace markdown image syntax with a proper img tag -->
        ![경주정보고 로고](assets/img/logo.webp)
        <div class="brand-text">
          <h1>경주정보고 School Tool Portal</h1>
          <div class="subtitle">Notice Translator · Record AI · Class Replacement · Statement Checker</div>
        </div>
      </div>

      <nav class="top-right" aria-label="상단 메뉴">
        <a href="https://github.com/your-repo" target="_blank" rel="noopener" class="small ghost">GitHub</a>
        <a href="#help" class="small ghost">도움말</a>
      </nav>
    </header>

    <!-- Hero: you can either use the <img> below or set a CSS background in assets/css/styles.css
         If you prefer CSS background, remove the <img> and add:
         .hero { background-image: url("../img/campus.gif"); } (when styles.css is in assets/css/) -->
    <section class="hero" aria-labelledby="hero-title">
      ![캠퍼스 전경](assets/img/campus.gif)
      <div class="hero-overlay" id="hero-title">
        <h2>교직원 전용 포털 — 빠르고 안전한 학교업무 도구</h2>
      </div>
    </section>

    <main class="main-content" role="main">
      <div id="tools" class="grid" aria-live="polite"></div>

      <div class="hint" id="help">
        사이트가 업데이트되지 않으면 Ctrl+F5로 강제 새로고침하세요. GitHub Pages 빌드 상태는 Actions 탭에서 확인하세요.
      </div>
    </main>
  </div>

  <!-- Preview panel / iframe for tools -->
  <div id="previewPanel" class="panel" role="dialog" aria-label="포털 미리보기" aria-hidden="true" hidden>
    <div class="panel-head">
      <div style="display:flex;align-items:center;gap:10px">
        <strong id="panelTitle">포털 미리보기</strong>
        <span class="small" id="panelSub">열기: —</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost small" id="openNewTab" title="새 탭에서 열기">새 탭</button>
        <button class="btn ghost small" id="closePanel" title="미리보기 닫기">닫기</button>
      </div>
    </div>
    <iframe id="previewFrame" src="" title="도구 미리보기"></iframe>
  </div>

  <noscript>
    이 사이트는 JavaScript에 의존합니다. 브라우저에서 JavaScript를 활성화해 주세요.
  </noscript>

  <script src="assets/js/app.js"></script>
</body>
</html>
